services:
  # 1. ChromaDB Vector Store
  - type: web
    name: iks-chromadb
    runtime: image
    image:
      url: chromadb/chroma:0.5.20
    plan: free
    envVars:
      - key: IS_PERSISTENT
        value: "TRUE"
      - key: ANONYMIZED_TELEMETRY
        value: "FALSE"

  # 2. Spring Boot Backend
  - type: web
    name: iks-backend
    runtime: java
    rootDir: chatbot
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -Dserver.port=$PORT -jar target/chatbot-0.0.1-SNAPSHOT.jar
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_HOST
        sync: false
      - key: SPRING_AI_VECTORSTORE_CHROMA_CLIENT_PORT
        value: "443"
