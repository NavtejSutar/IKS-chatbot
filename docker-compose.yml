version: '3.8'

services:
  # 1. ChromaDB Vector Store
  chromadb:
    image: chromadb/chroma:0.5.20
    container_name: iks-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  # 2. Spring Boot Backend (Spring AI)
  backend:
    build:
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: iks-backend
    ports:
      - "8080:8080"
    environment:
      - CLIENT_HOST=http://chromadb
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - chromadb
    restart: unless-stopped

  # 3. Web Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: iks-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BACKEND_HOST=backend
      - BACKEND_PORT=8080
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
